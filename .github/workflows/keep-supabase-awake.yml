# Supabase pauses free-plan projects after 7 days without activity. This makes one small read
# request to the staging project every day so it never gets that far. Upgrading the project to
# Pro removes the need for it.
#
# Uses the staging publishable key, which is public (every visitor to the staging site gets it),
# so it needs no secret and keeps working if the access token used for deploys changes.
name: Keep Supabase awake

on:
  schedule:
    - cron: "40 19 * * *"
  workflow_dispatch:

env:
  SUPABASE_URL: https://htdydskyvduyroswpmee.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_KMjuluvioCKGTt7UQ8_xRA_9qU7ZeJb

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from the staging database
        # Row-level security returns no rows to an anonymous caller; the request is what counts.
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/companies?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
